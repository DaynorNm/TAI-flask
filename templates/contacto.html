<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Flask Ejemplo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header>
        <h1>Mi aplicación Flask</h1>
        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
            <a href="{{ url_for('estudiantes') }}">Estudiantes</a>
            <a href="{{ url_for('contacto') }}">Contacto</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Contáctanos</h2>
            <p>Completa el siguiente formulario para preparar tu mensaje.</p>

            <form id="formulario-contacto">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Escribe tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo"
                       placeholder="ejemplo@correo.com" required>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5"
                          placeholder="Escribe tu mensaje" required></textarea>

                <button class="boton" type="submit">Preparar mensaje</button>
            </form>

            <p id="resultado" role="status"></p>
        </section>
    </main>

    <footer>
        <p>Proyecto académico - Flask</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
